<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Sonny &amp; Eddie Show</title>
<meta name="theme-color" content="#1a0508">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Midway">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0508; color: #fff4dc;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; display: block; }
  #backBtn { position: fixed; top: calc(8px + var(--sat)); left: calc(10px + env(safe-area-inset-left, 0px)); height: 38px; border-radius: 19px;
    border: 0; background: rgba(255,244,220,.14); color: #fff4dc; font: 700 14px system-ui, sans-serif; padding: 0 14px; cursor: pointer; z-index: 3; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 14px calc(12px + var(--sab)); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 2; }
  .btn { font: 700 17px/1 system-ui, sans-serif; color: #2a0812; background: linear-gradient(#ffe27a, #f5b52c); border: 0; border-radius: 999px;
    padding: 14px 26px; box-shadow: 0 4px 0 #a8661a, 0 6px 14px rgba(0,0,0,.4); cursor: pointer; min-width: 220px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8661a; }
  .btn:disabled { opacity: .5; }
  .btn.alt { background: linear-gradient(#f4f0ff, #cdbcf5); box-shadow: 0 4px 0 #6a50a8, 0 6px 14px rgba(0,0,0,.4); }
  .mode { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .mode[hidden] { display: none; }
  .askHead { font: 700 14px system-ui, sans-serif; color: #ffd75e; }
  .qbtn { width: min(100%, 460px); font: 700 16px/1.3 system-ui, sans-serif; color: #2a0812; background: #fffdf5; border: 3px solid #ffd75e; border-radius: 16px;
    padding: 11px 14px; cursor: pointer; text-align: center; box-shadow: 0 4px 0 #a8661a; }
  .qbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8661a; }
  .qbtn:disabled { opacity: .45; }
  #row { display: flex; gap: 14px; align-items: center; justify-content: center; font-size: 13px; color: #cdb896; flex-wrap: wrap; }
  body.side #panel { left: auto; right: 0; top: 0; width: 34%; justify-content: center; }
  body.side .btn { min-width: 0; width: 100%; }
  .link { background: none; border: 0; color: #cdb896; font: 600 13px system-ui, sans-serif; text-decoration: underline; cursor: pointer; padding: 4px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="backBtn">‹ Midway</button>
<div id="panel">
  <div id="pick" class="mode">
    <div class="askHead" id="fee"></div>
    <button class="btn" id="pickShow">🎭 Watch the Show</button>
    <button class="btn alt" id="pickAsk">🎤 Ask Sonny &amp; Eddie</button>
  </div>
  <div id="showCtl" class="mode" hidden>
    <button class="btn" id="goBtn">Start the show!</button>
  </div>
  <div id="askCtl" class="mode" hidden>
    <div class="askHead">Pick a question for the boys:</div>
    <button class="qbtn" id="q0"></button>
    <button class="qbtn" id="q1"></button>
  </div>
  <div id="row"><span id="count"></span><button class="link" id="switchBtn" hidden></button><button class="link" id="voiceBtn"></button></div>
</div>
<script src="../coins.js"></script>
<script src="bits.js"></script>
<script src="questions.js"></script>
<script>
"use strict";
const BITS = window.BITS;
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const img = s => { const i = new Image(); i.src = s; return i; };
const I = { photo: img("img/photo.webp") };
// sizes of the pictures and where Eddie's mouth is
// The photo is 1119 x 1406. Eddie's jaw is the part between his painted dummy lines, below his mouth.
const PW = 1119, PH = 1406;
const JAW = [[305, 556], [362, 553], [419, 552], [420, 626], [392, 640], [362, 643], [332, 640], [304, 630]];
// Sonny's lower lip and beard: a soft-edged piece that moves down a little when he talks (no hard lines).
const SONNY_LIP = { x: 590, y: 420, w: 190, h: 120, mouthY: 424, cx: 679 };
let sonnyPiece = null;
function buildSonnyPiece() {
  const { x, y, w, h, mouthY, cx } = SONNY_LIP, c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.drawImage(I.photo, x, y, w, h, 0, 0, w, h);
  g.globalCompositeOperation = "destination-in";
  const m = document.createElement("canvas"); m.width = w; m.height = h; const mg = m.getContext("2d");
  const r = mg.createRadialGradient(cx - x, mouthY - y, 10, cx - x, mouthY - y + 10, h * 0.95);
  r.addColorStop(0, "rgba(0,0,0,1)"); r.addColorStop(0.55, "rgba(0,0,0,1)"); r.addColorStop(1, "rgba(0,0,0,0)");
  mg.fillStyle = r; mg.fillRect(0, 0, w, h);
  mg.globalCompositeOperation = "destination-in";
  const v = mg.createLinearGradient(0, mouthY - y - 1, 0, mouthY - y + 3); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,1)");
  mg.fillStyle = v; mg.fillRect(0, 0, w, h);
  g.drawImage(m, 0, 0); sonnyPiece = c;
}
I.photo.addEventListener("load", () => { try { buildSonnyPiece(); } catch (e) { sonnyPiece = null; } });
const JAW_TOP = 552, EDDIE_MOUTH = [362, 556], SONNY_MOUTH = [690, 410], EDDIE_HAT = [345, 250], SONNY_HAT = [700, 40];

// ---------- Voices ----------
let voiceOn = store.get("ve-voice") !== "off";
function voiceLabel() { $("voiceBtn").textContent = voiceOn ? "🔊 Sound: on" : "🔇 Sound: off"; }
$("voiceBtn").onclick = () => { voiceOn = !voiceOn; store.set("ve-voice", voiceOn ? "on" : "off"); voiceLabel(); if (!voiceOn) player.pause(); };
const player = new Audio(); player.preload = "auto";
function voiceFile(key) { let h = 0x811c9dc5; for (const b of new TextEncoder().encode(key)) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; } return "voice/" + h.toString(16).padStart(8, "0") + ".mp3"; }
// mouth movement follows the loudness of the recording
let analyser = null, aData = null, acx = null;
function hookAnalyser() {
  if (analyser) return; try {
    acx = new (window.AudioContext || window.webkitAudioContext)(); const src = acx.createMediaElementSource(player);
    analyser = acx.createAnalyser(); analyser.fftSize = 512; aData = new Uint8Array(analyser.fftSize); src.connect(analyser); analyser.connect(acx.destination);
  } catch (e) { analyser = null; }
}
function loudness() {
  if (!analyser || player.paused) return null;
  analyser.getByteTimeDomainData(aData); let s = 0; for (let i = 0; i < aData.length; i++) { const v = (aData[i] - 128) / 128; s += v * v; }
  return Math.sqrt(s / aData.length);
}
function say(who, text, onEnd) {
  S.talker = who; S.line = text; S.lineT = 0;
  let done = false; const fin = () => { if (!done) { done = true; S.talker = null; player.onended = player.onerror = null; setTimeout(onEnd, 350); } };
  if (!voiceOn) { setTimeout(fin, 900 + text.length * 55); return; }
  player.onended = fin; player.onerror = () => phone(who, text, fin);
  player.src = voiceFile(who + ":" + text);
  const p = player.play(); if (p && p.catch) p.catch(() => phone(who, text, fin));
  setTimeout(fin, 5000 + text.length * 90);
}
function phone(who, text, fin) { // no recording for this line yet
  if (!("speechSynthesis" in window)) { setTimeout(fin, 900 + text.length * 55); return; }
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.pitch = who === "E" ? 1.6 : 0.95; u.rate = 1.05; u.onend = u.onerror = fin; speechSynthesis.speak(u); }
  catch (e) { setTimeout(fin, 900 + text.length * 55); }
}

// ---------- Show ----------
const S = { t: 0, talker: null, line: "", lineT: 0, busy: false, laugh: 0, bitNo: 0, jaw: 0 };
let order = [], seen = 0;
function nextBit() {
  if (!order.length) order = BITS.map((_, i) => i).sort(() => Math.random() - 0.5);
  return BITS[order.pop()];
}
// run a list of [who, line] and call done at the end
function perform(lines, done) {
  hookAnalyser(); if (acx && acx.state === "suspended") acx.resume();
  S.busy = true; let i = 0;
  const step = () => { if (i >= lines.length) { S.busy = false; S.laugh = 1; laugh(); done(); return; } const [who, line] = lines[i++]; say(who, line, step); };
  step();
}
function play() {
  if (S.busy) return;
  $("goBtn").disabled = true; $("goBtn").textContent = "…";
  perform(nextBit(), () => { seen++; $("count").textContent = "Jokes heard: " + seen + " of " + BITS.length; $("goBtn").disabled = false; $("goBtn").textContent = "Another one!"; });
}
$("goBtn").onclick = play;

// ---------- Ask Sonny & Eddie ----------
const QS = window.QUESTIONS; let qOrder = [], pair = [], asked = 0;
function nextQ() { if (!qOrder.length) qOrder = QS.map((_, i) => i).sort(() => Math.random() - 0.5); return qOrder.pop(); }
function newPair() {
  let a = nextQ(), b = nextQ(); if (b === a) b = nextQ();
  pair = [a, b]; $("q0").textContent = QS[a].q; $("q1").textContent = QS[b].q;
  $("q0").disabled = $("q1").disabled = false; layout();
}
function ask(k) {
  if (S.busy) return;
  const item = QS[pair[k]]; S.question = item.q;
  $("q0").disabled = $("q1").disabled = true;
  perform(item.a, () => { asked++; $("count").textContent = "Questions asked: " + asked; S.question = null; newPair(); });
}
$("q0").onclick = () => ask(0); $("q1").onclick = () => ask(1);

// ---------- Choosing a show ----------
function setMode(m) {
  S.mode = m;
  $("pick").hidden = m !== "pick"; $("showCtl").hidden = m !== "show"; $("askCtl").hidden = m !== "ask";
  $("switchBtn").hidden = m === "pick";
  $("switchBtn").textContent = m === "show" ? "🎤 Ask Sonny & Eddie instead" : "🎭 Watch the Show instead";
  if (m === "show") { $("count").textContent = BITS.length + " jokes in the act"; }
  if (m === "ask") { $("count").textContent = QS.length + " questions to ask"; newPair(); }
  if (m === "pick") { $("count").textContent = ""; showFee(); }
  layout();
}
// Getting in costs 1 Midway coin per visit (switching between the two shows is free once you're in)
let paid = false;
function showFee() {
  const n = Coins.get();
  $("fee").innerHTML = n > 0 ? "🎟️ The show costs 🪙 1 coin. You have " + n + "." : "You're out of coins! <a href=\"../\" style=\"color:#ffd75e\">Win more on the Midway ›</a>";
  $("pickShow").disabled = $("pickAsk").disabled = n < 1 && !paid;
}
function enter(m) {
  if (!paid) { if (!Coins.spend(1)) { showFee(); return; } paid = true; Coins.chime(); }
  setMode(m);
}
$("pickShow").onclick = () => enter("show");
$("pickAsk").onclick = () => enter("ask");
showFee();
$("switchBtn").onclick = () => { if (!S.busy) setMode(S.mode === "show" ? "ask" : "show"); };
$("backBtn").onclick = () => { player.pause(); location.href = "../"; };
// a little canned laugh and a rimshot
function laugh() {
  try {
    const a = acx || new (window.AudioContext || window.webkitAudioContext)(), t = a.currentTime;
    const n = a.createBuffer(1, a.sampleRate * 0.4, a.sampleRate), d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (a.sampleRate * 0.12));
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = n; f.type = "highpass"; f.frequency.value = 2500; g.gain.value = 0.35;
    s.connect(f).connect(g).connect(a.destination); s.start(t + 0.18);
    [[180, 0], [120, 0.09]].forEach(([fr, dl]) => { const o = a.createOscillator(), og = a.createGain(); o.frequency.setValueAtTime(fr, t + dl); o.frequency.exponentialRampToValueAtTime(60, t + dl + 0.15);
      og.gain.setValueAtTime(0.4, t + dl); og.gain.exponentialRampToValueAtTime(0.001, t + dl + 0.18); o.connect(og).connect(a.destination); o.start(t + dl); o.stop(t + dl + 0.2); });
  } catch (e) {}
}

// ---------- Layout ----------
let W = 0, H = 0, DPR = 1; const L = {};
function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + "px"; cv.style.height = H + "px";
  L.side = W > H * 1.15; document.body.classList.toggle("side", L.side);
  const top = $("backBtn").getBoundingClientRect().bottom + 6, bottom = L.side ? H - 6 : H - $("panel").getBoundingClientRect().height - 4;
  L.top = top; L.bottom = bottom;
  const sw = L.side ? W * 0.66 : W;
  L.vh = Math.max(40, Math.min(64, (bottom - top) * 0.09));     // the sign across the top
  L.band = L.side ? 0 : Math.min(110, (bottom - top) * 0.16);   // room for speech bubbles above the photo
  const areaTop = top - 6 + L.vh + 10 + L.band, areaH = bottom - areaTop - 6, areaW = sw - 24;
  L.s = Math.min(areaW / PW, areaH / PH);
  L.pw = PW * L.s; L.ph = PH * L.s; L.px = (sw - L.pw) / 2; L.py = areaTop + (areaH - L.ph) / 2;
  L.u = L.pw / 6; L.sw = sw;
}
addEventListener("resize", layout);

// ---------- Drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
const P = (x, y) => [L.px + x * L.s, L.py + y * L.s];
function drawStage() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#3a0a12"); g.addColorStop(1, "#14040a"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // curtains on both sides
  const cw = Math.max(30, L.sw * 0.1);
  for (const side of [0, 1]) for (let i = 0; i < 5; i++) {
    const x = side ? W - cw + i * cw / 5 : i * cw / 5, w = cw / 5;
    const cg = ctx.createLinearGradient(x, 0, x + w, 0); cg.addColorStop(0, "#6a0e1a"); cg.addColorStop(0.5, "#b8202e"); cg.addColorStop(1, "#6a0e1a");
    ctx.fillStyle = cg; ctx.fillRect(x, 0, w + 1, H);
  }
  // sign with gold fringe
  const vh = L.vh, vy = L.top - 6;
  ctx.fillStyle = "#9a1626"; ctx.fillRect(0, vy, W, vh);
  for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.arc(x + 15, vy + vh, 15, 0, Math.PI); ctx.fill(); }
  ctx.fillStyle = "#e0a838"; ctx.fillRect(0, vy + vh - 3, W, 3);
  ctx.fillStyle = "#ffd75e"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  let fs = Math.round(vh * 0.46); ctx.font = `${fs}px Rye, Georgia, serif`;
  while (ctx.measureText("THE SONNY & EDDIE SHOW").width > W - 30 && fs > 10) { fs--; ctx.font = `${fs}px Rye, Georgia, serif`; }
  ctx.fillText("THE SONNY & EDDIE SHOW", W / 2, vy + vh * 0.48);
  // spotlight behind the photo
  const cx = L.px + L.pw / 2, cy = L.py + L.ph * 0.4, sp = ctx.createRadialGradient(cx, cy, 10, cx, cy, L.pw * 0.9);
  sp.addColorStop(0, "rgba(255,240,200,.28)"); sp.addColorStop(1, "rgba(255,240,200,0)"); ctx.fillStyle = sp; ctx.fillRect(0, 0, W, H);
}

function drawPhoto() {
  if (!(I.photo.complete && I.photo.naturalWidth)) return;
  const { px, py, pw, ph, s } = L;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = "#b8860b"; rr(px - 6, py - 6, pw + 12, ph + 12, 10); ctx.fill();
  ctx.restore();
  ctx.drawImage(I.photo, px, py, pw, ph);
  // Eddie's jaw drops with the loudness of his voice
  const talk = S.talker === "E";
  let open = 0;
  if (talk) { const l = loudness(); open = l == null ? (Math.sin(S.lineT * 22) > 0 ? 1 : 0.2) : clamp((l - 0.015) * 9, 0, 1); }
  S.jaw += (open - S.jaw) * 0.5;
  const drop = S.jaw * 26 * s; // in screen pixels (26 photo pixels at full open)
  if (drop > 0.4) {
    const path = () => { ctx.beginPath(); JAW.forEach(([x, y], k) => { const [X, Y] = P(x, y); k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath(); };
    // dark inside of the mouth where the jaw used to be
    ctx.save(); path(); ctx.clip();
    const [mx, my] = P(EDDIE_MOUTH[0], JAW_TOP), mg = ctx.createLinearGradient(0, my, 0, my + drop + 4);
    mg.addColorStop(0, "#1a0406"); mg.addColorStop(1, "#4a0f14"); ctx.fillStyle = mg; ctx.fillRect(px, my - 2, pw, drop + 6);
    ctx.restore();
    // the jaw itself, moved down
    ctx.save(); ctx.translate(0, drop); path(); ctx.clip(); ctx.drawImage(I.photo, px, py, pw, ph); ctx.restore();
    // a thin shadow line along the top of the dropped jaw
    ctx.strokeStyle = "rgba(20,5,5,.5)"; ctx.lineWidth = 1.2; ctx.beginPath();
    JAW.slice(0, 3).forEach(([x, y], k) => { const [X, Y] = P(x, y); k ? ctx.lineTo(X, Y + drop) : ctx.moveTo(X, Y + drop); }); ctx.stroke();
  }
  // Sonny talks normally: his lower lip and beard move down a little, showing a dark mouth between his lips
  let sOpen = 0;
  if (S.talker === "S") { const l = loudness(); sOpen = l == null ? (0.5 + 0.5 * Math.sin(S.lineT * 18)) : clamp((l - 0.012) * 8, 0, 1); }
  S.sjaw = (S.sjaw || 0) + (sOpen - (S.sjaw || 0)) * 0.45;
  const sd = S.sjaw * 7 * s;
  if (sonnyPiece && sd > 0.3) {
    const [mx, my] = P(SONNY_LIP.cx, SONNY_LIP.mouthY);
    ctx.save(); ctx.filter = "blur(" + Math.max(0.5, s * 1.5) + "px)";
    ctx.fillStyle = "rgba(35,10,10,.9)"; ctx.beginPath(); ctx.ellipse(mx, my + sd * 0.45, 36 * s, sd * 0.6 + 1, 0, 0, 7); ctx.fill(); ctx.restore();
    const [ox, oy] = P(SONNY_LIP.x, SONNY_LIP.y);
    ctx.drawImage(sonnyPiece, ox, oy + sd, SONNY_LIP.w * s, SONNY_LIP.h * s);
  }
  // a soft glow on whoever is talking
  if (S.talker) {
    const [gx, gy] = S.talker === "E" ? P(355, 460) : P(690, 330), r = (S.talker === "E" ? 190 : 230) * s;
    ctx.save(); ctx.globalCompositeOperation = "soft-light";
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, r); g.addColorStop(0, "rgba(255,240,210,.45)"); g.addColorStop(1, "rgba(255,240,210,0)");
    ctx.fillStyle = g; ctx.fillRect(gx - r, gy - r, r * 2, r * 2); ctx.restore();
  }
}

function drawBubble(px, py, text, left) {
  const fs = clamp(L.u * 0.36, 13, 19); ctx.font = `700 ${fs}px system-ui, sans-serif`;
  const maxW = Math.min(W * 0.62, 320), words = text.split(" "), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW - 24 && cur) { lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur);
  const tw = Math.max(...lines.map(l => ctx.measureText(l).width)), lh = fs * 1.28, bw = tw + 26, bh = lines.length * lh + 14;
  const bx = clamp(left ? px - bw * 0.45 : px - bw * 0.55, 8, L.sw - bw - 8), by = Math.max(L.top - 6 + L.vh + 8, L.py - bh - 10);
  if (py < by + bh + 8) py = by + bh + 14;
  ctx.fillStyle = "#fffdf5"; ctx.strokeStyle = "#2a0812"; ctx.lineWidth = 2.5; rr(bx, by, bw, bh, 14); ctx.fill(); ctx.stroke();
  const tx = clamp(px, bx + 20, bx + bw - 20);
  ctx.beginPath(); ctx.moveTo(tx - 9, by + bh - 1); ctx.lineTo(px, py - 4); ctx.lineTo(tx + 9, by + bh - 1); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fffdf5"; ctx.fillRect(tx - 8, by + bh - 4, 16, 6);
  ctx.fillStyle = "#2a0812"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  lines.forEach((l, i) => ctx.fillText(l, bx + bw / 2, by + 7 + lh * (i + 0.5)));
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawStage(); drawPhoto();
  if (S.talker && S.line) {
    if (S.talker === "E") { const [x, y] = P(EDDIE_HAT[0], EDDIE_HAT[1]); drawBubble(x, y, S.line, true); }
    else { const [x, y] = P(SONNY_HAT[0], SONNY_HAT[1]); drawBubble(x, y, S.line, false); }
  }
  if (S.question) {
    const fs = clamp(L.pw * 0.045, 13, 18); ctx.font = `800 ${fs}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const t = "Q: " + S.question, tw = Math.min(ctx.measureText(t).width + 28, L.pw), y = L.py + L.ph - fs * 1.6;
    ctx.fillStyle = "rgba(42,8,18,.85)"; rr(L.px + L.pw / 2 - tw / 2, y - fs, tw, fs * 2, fs); ctx.fill();
    ctx.fillStyle = "#ffd75e"; ctx.fillText(t, L.px + L.pw / 2, y, L.pw - 24);
  }
  if (S.laugh > 0) {
    ctx.globalAlpha = Math.min(1, S.laugh * 2); ctx.fillStyle = "#ffd75e"; ctx.textAlign = "center";
    ctx.font = `${Math.round(clamp(L.u * 0.6, 20, 34))}px Rye, Georgia, serif`;
    ctx.fillText("Ba-dum tss!", L.px + L.pw / 2, L.py + L.ph * 0.93); ctx.globalAlpha = 1;
  }
}
let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; S.t += dt; S.lineT += dt; S.laugh = Math.max(0, S.laugh - dt * 0.6); draw(); requestAnimationFrame(frame); }
voiceLabel(); setMode("pick");
layout(); if (document.fonts && document.fonts.load) document.fonts.load("20px Rye").then(layout).catch(() => {});
requestAnimationFrame(frame);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("../sw.js").catch(() => {});
