<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sonny the Sorta Psychic</title>
<meta name="theme-color" content="#1a0a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Midway">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0a16; color: #fff4dc;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; display: block; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px calc(10px + var(--sab));
    display: flex; flex-direction: column; align-items: center; gap: 7px; }
  body.side #panel { left: 52%; top: 0; justify-content: center; padding: 16px; }
  #prompt { font: 600 14px/1.3 system-ui, sans-serif; color: #f2d9a6; text-align: center; height: 74px; max-width: 560px;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #prompt.says { font: 600 17px/1.3 Georgia, serif; color: #ffd75e; text-shadow: 0 2px 6px rgba(0,0,0,.6); display: block; padding-top: 2px; }
  #prompt.says::before { content: "Sonny: "; color: #e0b0ff; margin-right: 6px; font-style: italic; }
  #topics { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; max-width: 560px; }
  .topic { font: 700 15px/1 system-ui, sans-serif; color: #2a0812; background: linear-gradient(#ffe27a, #f5b52c);
    border: 0; border-radius: 999px; padding: 10px 15px; box-shadow: 0 3px 0 #a8661a; cursor: pointer; }
  .topic:active { transform: translateY(2px); box-shadow: 0 1px 0 #a8661a; }
  .topic:disabled { opacity: .45; }
  #bottomRow { display: flex; gap: 12px; align-items: center; justify-content: center; font-size: 13px; color: #cdb896; flex-wrap: wrap; }
  .link { background: none; border: 0; color: #cdb896; font: 600 13px system-ui, sans-serif; text-decoration: underline; cursor: pointer; padding: 4px; }
  #backBtn { position: fixed; top: calc(8px + var(--sat)); left: calc(10px + env(safe-area-inset-left, 0px)); height: 38px; border-radius: 19px;
    border: 0; background: rgba(255,244,220,.14); color: #fff4dc; font: 700 14px system-ui, sans-serif; padding: 0 14px; cursor: pointer; z-index: 3; }
  /* the fortune card comes out of the slot */
  #cardWrap { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 4;
    background: rgba(10,4,10,0); transition: background .5s; }
  #cardWrap.show { display: flex; }
  #cardWrap.up { background: rgba(10,4,10,.6); }
  #card { width: min(92vw, 360px); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; background: #f6ead0; color: #3a1a10; border-radius: 8px; padding: 16px 18px 14px; text-align: center;
    box-shadow: 0 18px 40px rgba(0,0,0,.6); border: 6px double #8a5a20; transition: transform .8s cubic-bezier(.2,.9,.3,1.05), opacity .3s;
    background-image: radial-gradient(rgba(138,90,32,.08) 1px, transparent 1px); background-size: 6px 6px; }
  #card h3 { font: 400 21px/1.1 "Rye", Georgia, serif; margin: 0 0 2px; color: #6a1a6a; }
  #card .sub { font: 400 13px/1 "Rye", Georgia, serif; color: #8a5a20; }
  #card .topicName { font: 800 12px system-ui, sans-serif; letter-spacing: 2px; color: #8a5a20; text-transform: uppercase; margin-bottom: 6px; }
  #card .fortune { font: 600 19px/1.4 Georgia, serif; margin: 12px 0; }
  #card .lucky { font: 600 13px system-ui, sans-serif; color: #6a4a2a; }
  #card .fine { font: 500 11px system-ui, sans-serif; color: #8a6a4a; margin-top: 8px; font-style: italic; }
  #card .stars { color: #b08020; letter-spacing: 6px; margin: 4px 0 0; }
  #cardBtns { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .cbtn { font: 700 15px/1 system-ui, sans-serif; border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer; }
  .cbtn.main { color: #2a0812; background: linear-gradient(#ffe27a, #f5b52c); box-shadow: 0 3px 0 #a8661a; }
  .cbtn.alt { color: #3a1a10; background: rgba(58,26,16,.1); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="backBtn">‹ Midway</button>
<div id="panel">
  <div id="prompt">Each fortune costs 🪙 1 coin. Pick a topic, or tap INSERT COIN.</div>
  <div id="topics"></div>
  <div id="bottomRow"><span id="coins"></span><span id="collected"></span><button class="link" id="voiceBtn"></button><button class="link" id="voicePick"></button></div>
</div>
<div id="cardWrap">
  <div id="card">
    <div class="topicName" id="cardTopic"></div>
    <h3>Sonny</h3>
    <div class="sub">The Sorta Psychic</div>
    <div class="stars">☾ ★ ☽</div>
    <div class="fortune" id="cardText"></div>
    <div class="lucky" id="cardLucky"></div>
    <div class="fine" id="cardFine"></div>
    <div id="cardBtns"><button class="cbtn main" id="againBtn">Ask again (🪙 1)</button><button class="cbtn alt" id="closeBtn">Close</button></div>
  </div>
</div>

<script src="../coins.js"></script>
<script src="fortunes.js"></script>
<script>
"use strict";
const FORTUNES = window.FORTUNES, OPENERS = window.OPENERS, LUCKY = window.LUCKY, FINE = window.FINE;
const pick = a => a[Math.floor(Math.random() * a.length)];

// Spots on the machine picture (it is 1024 x 1536)
const IMG_W = 1024, IMG_H = 1536;
const SPOT = {
  ball: { x: 505, y: 868, r: 98 },
  lamps: [{ x: 268, y: 512 }, { x: 740, y: 512 }],
  bulbs: [[118, 236], [146, 164], [204, 118], [266, 68], [346, 42], [428, 26], [514, 22], [596, 26], [678, 44], [758, 74], [816, 124], [878, 164], [900, 236]],
  sign: { x: 200, y: 1082, w: 624, h: 112 },   // "Your future looks Sonny…" plaque: Sonny's words show here
  coin: { x: 408, y: 1214, w: 206, h: 90 },
  slot: { x: 505, y: 1392 },
};

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const machine = new Image(); machine.src = "img/machine.webp";

// Collection: which fortunes you've seen, and a no-repeat bag per topic
let seen = new Set(); try { seen = new Set(JSON.parse(store.get("fs-seen2") || "[]")); } catch (e) {}
const TOTAL = Object.values(FORTUNES).reduce((n, a) => n + a.length, 0);
const bags = {};
function nextFortune(topic) {
  if (!bags[topic] || !bags[topic].length) {
    const all = FORTUNES[topic].map((_, i) => i), unseen = all.filter(i => !seen.has(topic + i));
    bags[topic] = (unseen.length ? unseen : all).sort(() => Math.random() - 0.5);
  }
  const i = bags[topic].pop(); seen.add(topic + i); store.set("fs-seen2", JSON.stringify([...seen]));
  return FORTUNES[topic][i];
}
function showCollected() { $("collected").textContent = "Fortunes collected: " + seen.size + " of " + TOTAL; }

// ---------- Voice ----------
let voiceOn = store.get("fs-voice") !== "off";
const canSpeak = "speechSynthesis" in window;
const RATE = 1.08, PITCH = 0.95; // natural speed and pitch (lower pitch makes phone voices sound robotic)
// Phone voices vary a lot. Rank them: natural-sounding first, novelty robot voices never.
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|ralph|junior|kathy|princess|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
const GOOD = /premium|enhanced|natural|neural|online|google/i;
const MALE = /daniel|aaron|arthur|alex|tom|evan|nathan|oliver|james|guy|david|mark|george|ryan|eric|christopher|andrew|brian|roger|steffan|thomas|male/i;
function goodVoices() {
  if (!canSpeak) return [];
  const en = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang) && !NOVELTY.test(v.name));
  const score = v => (GOOD.test(v.name) ? 4 : 0) + (MALE.test(v.name) ? 2 : 0) + (/en[-_]US/i.test(v.lang) ? 1 : 0) + (v.localService === false ? 1 : 0);
  return en.sort((a, b) => score(b) - score(a));
}
function chosenVoice() {
  const vs = goodVoices(); if (!vs.length) return null;
  const want = store.get("fs-voice-name");
  return vs.find(v => v.name === want) || vs[0];
}
function voiceLabel() {

  $("voiceBtn").textContent = voiceOn ? "🔊 Sonny’s voice: on" : "🔇 Sonny’s voice: off";
  $("voicePick").textContent = "";
}
$("voiceBtn").onclick = () => { voiceOn = !voiceOn; store.set("fs-voice", voiceOn ? "on" : "off"); voiceLabel(); if (!voiceOn) { player.pause(); if (canSpeak) speechSynthesis.cancel(); } };
$("voicePick").onclick = () => {
  const vs = goodVoices(); if (!vs.length) return;
  const cur = chosenVoice(), next = vs[(vs.indexOf(cur) + 1) % vs.length];
  store.set("fs-voice-name", next.name); voiceLabel();
  if (S.mode === "idle") speak("Sonny the Sorta Psychic, at your service. Five dollars, please.", () => {});
};
if (canSpeak && "onvoiceschanged" in speechSynthesis) speechSynthesis.addEventListener("voiceschanged", voiceLabel);
// Recorded voice (Joe): every fortune has its own mp3 in voice/, named from the words of the line.
// One audio player is reused so phones that need a tap to start sound keep playing for the second line.
const player = new Audio(); player.preload = "auto";
function voiceFile(text) {
  let h = 0x811c9dc5;
  for (const b of new TextEncoder().encode(text)) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; }
  return "voice/" + h.toString(16).padStart(8, "0") + ".mp3";
}
function speak(text, onEnd) {
  if (!voiceOn) { setTimeout(onEnd, 900 + text.length * 50); return; }
  let done = false; const fin = () => { if (!done) { done = true; player.onended = player.onerror = null; onEnd(); } };
  player.onended = fin;
  player.onerror = () => { if (!done) { player.onended = player.onerror = null; speakWithPhone(text, fin); } }; // no recording: use the phone's voice
  player.src = voiceFile(text);
  const pr = player.play(); if (pr && pr.catch) pr.catch(() => { if (!done) { player.onended = player.onerror = null; speakWithPhone(text, fin); } });
  setTimeout(fin, 4000 + text.length * 90);
}
function speakWithPhone(text, onEnd) {
  if (!canSpeak) { setTimeout(onEnd, 900 + text.length * 50); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, "...").replace(/[“”]/g, ""));
    const v = chosenVoice(); if (v) { try { u.voice = v; u.lang = v.lang; } catch (e) {} }
    u.pitch = PITCH; u.rate = RATE; u.volume = 1;
    let done = false; const fin = () => { if (!done) { done = true; onEnd(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 2500 + text.length * 80);
    speechSynthesis.speak(u);
  } catch (e) { setTimeout(onEnd, 900 + text.length * 50); }
}

// ---------- Sound ----------
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === "suspended") ac.resume();
  return ac;
}
function tone(freq, dur, type = "sine", peak = 0.15, delay = 0, slideTo = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  coin() { tone(1800, 0.08, "square", 0.06); tone(2400, 0.25, "triangle", 0.08, 0.06); tone(900, 0.15, "triangle", 0.06, 0.3); },
  mystic() { [392, 466, 554, 659, 554, 466].forEach((f, i) => tone(f, 0.6, "sine", 0.07, i * 0.22)); tone(98, 2.2, "triangle", 0.06); },
  card() { [600, 520, 600, 520, 600].forEach((f, i) => tone(f, 0.05, "square", 0.04, i * 0.06)); tone(300, 0.3, "triangle", 0.06, 0.3, 900); },
};

// ---------- State ----------
const S = { mode: "idle", t: 0, glow: 0, sign: null, signT: 0, topic: "", fortune: "", coinT: 9 };

function showCoins() { const n = Coins.get(); $("coins").textContent = "🪙 Your coins: " + n; }
function noCoins() {
  const p = $("prompt"); p.classList.remove("says");
  p.innerHTML = "<span>Out of coins! Sonny doesn’t work for free.<br>Win rounds in the other Midway games to earn more. <a href=\"../\" style=\"color:#ffd75e\">Go win coins ›</a></span>";
  S.coinT = 0; tone(220, 0.25, "square", 0.06); tone(180, 0.35, "square", 0.06, 0.2);
}
function ask(topic) {
  if (S.mode !== "idle") return;
  audio();
  if (!Coins.spend(1)) { noCoins(); return; }
  showCoins(); sfx.coin(); S.coinT = 0;
  if (canSpeak) speechSynthesis.getVoices();
  S.topic = topic; S.fortune = nextFortune(topic);
  setButtons(false);
  S.mode = "gaze"; sfx.mystic();
  const opener = pick(OPENERS);
  S.sign = opener; say(opener);
  speak(opener, () => {
    S.mode = "tell"; S.sign = S.fortune; say(S.fortune);
    speak(S.fortune, () => setTimeout(showCard, 300));
  });
}
function say(text) { const p = $("prompt"); p.classList.add("says"); p.textContent = text; }
function showCard() {
  S.mode = "card"; sfx.card();
  $("cardTopic").textContent = S.topic;
  $("cardText").textContent = "“" + S.fortune + "”";
  $("cardLucky").textContent = pick(LUCKY);
  $("cardFine").textContent = pick(FINE);
  // start tiny at the card slot, then grow into view
  const slot = toScreen(SPOT.slot.x, SPOT.slot.y);
  const card = $("card"), wrap = $("cardWrap");
  card.style.transition = "none"; card.style.opacity = "1"; card.style.transform = "none";
  wrap.classList.add("show");
  const r = card.getBoundingClientRect();
  card.style.transform = `translate(${slot.x - (r.left + r.width / 2)}px, ${slot.y - (r.top + r.height / 2)}px) scale(0.18)`;
  card.offsetHeight; // apply the start position
  card.style.transition = "";
  requestAnimationFrame(() => { wrap.classList.add("up"); card.style.transform = "none"; });
  showCollected();
}
function closeCard() {
  const wrap = $("cardWrap"), card = $("card");
  wrap.classList.remove("up"); card.style.opacity = "0";
  setTimeout(() => wrap.classList.remove("show"), 320);
  S.mode = "idle"; S.sign = null; setButtons(true);
  $("prompt").classList.remove("says");
  $("prompt").textContent = Coins.get() > 0 ? "Pick another topic. Sonny has plenty more to say. (1 coin)" : "That was your last coin. Win more in the other Midway games!";
}
$("againBtn").onclick = closeCard;
$("closeBtn").onclick = closeCard;
$("backBtn").onclick = () => { if (canSpeak) speechSynthesis.cancel(); location.href = "../"; };
$("cardWrap").addEventListener("click", e => { if (e.target === $("cardWrap")) closeCard(); });

function setButtons(on) { document.querySelectorAll(".topic").forEach(b => b.disabled = !on); }
for (const t of Object.keys(FORTUNES)) {
  const b = document.createElement("button"); b.className = "topic"; b.textContent = t;
  b.onclick = () => ask(t); $("topics").appendChild(b);
}
cv.addEventListener("click", e => { // tap INSERT COIN or the crystal ball for a surprise topic
  if (S.mode !== "idle") return;
  const p = toImage(e.clientX, e.clientY), c = SPOT.coin, b = SPOT.ball;
  const onCoin = p.x > c.x - 20 && p.x < c.x + c.w + 20 && p.y > c.y - 20 && p.y < c.y + c.h + 20;
  if (onCoin || Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.3) ask(pick(Object.keys(FORTUNES)));
});

// ---------- Layout ----------
let W = 0, H = 0, DPR = 1;
const L = {};
function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  const sat = $("backBtn").getBoundingClientRect().top - 8;
  L.side = W > H * 1.05;
  document.body.classList.toggle("side", L.side);
  const top = sat + (L.side ? 8 : 50);
  const panelH = L.side ? 0 : $("panel").getBoundingClientRect().height;
  const availW = L.side ? W * 0.52 - 16 : W - 12, availH = H - top - (L.side ? 8 : panelH + 2);
  L.s = Math.min(availW / IMG_W, availH / IMG_H);
  L.w = IMG_W * L.s; L.h = IMG_H * L.s;
  L.x = (L.side ? Math.max(8 + (availW - L.w) / 2, Math.min(130, W * 0.52 - L.w - 8)) : (W - L.w) / 2); L.y = top + (availH - L.h) / 2;
}
const toScreen = (x, y) => ({ x: L.x + x * L.s, y: L.y + y * L.s });
const toImage = (x, y) => ({ x: (x - L.x) / L.s, y: (y - L.y) / L.s });
addEventListener("resize", layout);

// ---------- Drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace("A", a)); g.addColorStop(1, color.replace("A", 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#2a1024"); bg.addColorStop(1, "#120610");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if (!(machine.complete && machine.naturalWidth)) return;
  ctx.drawImage(machine, L.x, L.y, L.w, L.h);
  const s = L.s, t = S.t, busy = S.mode === "gaze" || S.mode === "tell";
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  // marquee bulbs: slow twinkle when idle, chase when Sonny is working
  SPOT.bulbs.forEach(([bx, by], i) => {
    const wave = 0.5 + 0.5 * Math.sin(t * 2 + i * 1.7);
    const a = busy ? ((Math.floor(t * 9) + i) % 3 === 0 ? 0.85 : 0.1) : 0.15 + 0.35 * wave;
    const p = toScreen(bx, by); glow(p.x, p.y, 34 * s, "rgba(255,220,140,A)", a);
  });
  // lamps flicker
  for (const l of SPOT.lamps) { const p = toScreen(l.x, l.y); glow(p.x, p.y, 90 * s, "rgba(255,190,110,A)", 0.12 + 0.08 * Math.sin(t * 7 + l.x) + 0.15 * S.glow); }
  // crystal ball
  const b = SPOT.ball, bp = toScreen(b.x, b.y), br = b.r * s;
  glow(bp.x, bp.y, br * 2.6, "rgba(190,110,255,A)", 0.18 + 0.1 * Math.sin(t * 2) + 0.35 * S.glow);
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(bp.x, bp.y, br * 0.95, 0, 7); ctx.clip();
  const n = 12 + Math.round(S.glow * 26);
  for (let i = 0; i < n; i++) {
    const a = t * (0.8 + S.glow * 3) + i * 2.4, r2 = br * (0.15 + 0.75 * ((i * 37) % 10) / 10);
    ctx.globalAlpha = Math.max(0, 0.45 + 0.55 * Math.sin(t * 5 + i));
    ctx.fillStyle = i % 3 ? "#fff3ff" : "#ffe7a0";
    ctx.beginPath(); ctx.arc(bp.x + Math.cos(a) * r2, bp.y + Math.sin(a * 1.3) * r2 * 0.75, (1.2 + (i % 3) * 0.9) * Math.max(1, s * 2.2), 0, 7); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha = 1;
  // coin plate: pulses to invite a tap; flashes when a coin goes in
  const c = SPOT.coin, cp = toScreen(c.x, c.y);
  if (S.mode === "idle") { ctx.strokeStyle = `rgba(255,230,150,${0.35 + 0.35 * Math.sin(t * 3)})`; ctx.lineWidth = 3; rr(cp.x - 3, cp.y - 3, c.w * s + 6, c.h * s + 6, 6); ctx.stroke(); }
  if (S.coinT < 0.6) { ctx.save(); ctx.globalCompositeOperation = "lighter"; glow(cp.x + c.w * s / 2, cp.y + c.h * s / 2, 120 * s, "rgba(255,230,150,A)", 0.7 * (1 - S.coinT / 0.6)); ctx.restore(); }
  // the sign glows while Sonny talks
  if (busy) { const g = SPOT.sign, p = toScreen(g.x, g.y); ctx.save(); ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = `rgba(255,200,120,${0.08 + 0.06 * Math.sin(t * 8)})`; rr(p.x, p.y, g.w * s, g.h * s, 8 * s); ctx.fill(); ctx.restore(); }
}

let last = performance.now(), lastSign = null;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  S.t += dt; S.coinT += dt;
  if (S.sign !== lastSign) { lastSign = S.sign; S.signT = S.t; }
  const target = S.mode === "gaze" || S.mode === "tell" ? 1 : 0;
  S.glow += (target - S.glow) * Math.min(1, dt * 3);
  draw();
  requestAnimationFrame(frame);
}

voiceLabel(); showCollected(); showCoins();
layout();
